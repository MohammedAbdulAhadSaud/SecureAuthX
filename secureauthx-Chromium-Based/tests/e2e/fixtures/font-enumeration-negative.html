<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SecureAuthX E2E — Font Enumeration NEGATIVE / Control</title>
</head>
<body>
  <h1>Font Enumeration Detector — NEGATIVE / Control</h1>
  <p>Calls <code>ctx.measureText(...)</code> only 3 times — representing
  ordinary canvas text layout (e.g. centering a label), well under the
  detector's unchanged threshold of "more than 15 calls."</p>
  <button id="runBtn">Run</button>
  <div id="result">not run yet</div>
  <script>
    document.getElementById("runBtn").addEventListener("click", () => {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      ctx.font = "16px sans-serif";
      // A realistic, ordinary pattern: measure a label once, maybe
      // re-measure after a font-size tweak -- three calls total.
      ctx.measureText("Hello");
      ctx.font = "18px sans-serif";
      ctx.measureText("Hello");
      ctx.measureText("Hello, world");
      document.getElementById("result").textContent = "measureText called 3 times";
    });
  </script>
</body>
</html>
