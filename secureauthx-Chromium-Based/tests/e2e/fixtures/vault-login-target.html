<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><title>SecureAuthX E2E — Vault autofill target</title></head>
<body>
  <h1>Login form (vault autofill target)</h1>

    <input type="email" name="email" autocomplete="username" id="loginEmail" />
    <input type="password" id="loginPassword" />
    <button type="submit">Log in</button>
  </form>
</body>
</html>
