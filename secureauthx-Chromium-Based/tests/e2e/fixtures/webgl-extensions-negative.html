<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SecureAuthX E2E — WebGL Extension Enumeration NEGATIVE / Control</title>
</head>
<body>
  <h1>WebGL Extension Enumeration — NEGATIVE / Control</h1>
  <p>Checks for one or two SPECIFIC named extensions only — ordinary
  feature-detection, exactly like a real WebGL app deciding whether
  <code>OES_texture_float</code> is available before using it. Never calls
  <code>getSupportedExtensions()</code>.</p>
  <button id="runBtn">Run</button>
  <div id="result">not run yet</div>
  <script>
    document.getElementById("runBtn").addEventListener("click", () => {
      const canvas = document.createElement("canvas");
      const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
      if (!gl) {
        document.getElementById("result").textContent = "WebGL not available in this browser";
        return;
      }
      const hasFloatTextures = !!gl.getExtension("OES_texture_float");
      const hasInstancedArrays = !!gl.getExtension("ANGLE_instanced_arrays");
      document.getElementById("result").textContent =
        `checked 2 named extensions (float=${hasFloatTextures}, instanced=${hasInstancedArrays})`;
    });
  </script>
</body>
</html>
